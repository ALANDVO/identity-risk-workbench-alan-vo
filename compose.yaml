services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      AUTH_MODE: oidc
      BIND_HOST: 0.0.0.0
      DATABASE_PATH: /data/identity-risk.db
      COOKIE_SECURE: "true"
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?Set your issuer discovery URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set your OIDC client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?Set the HTTPS callback URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set the HTTPS frontend origin}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-realm_access.roles}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - evidence:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  evidence:

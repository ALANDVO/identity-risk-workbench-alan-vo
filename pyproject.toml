[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "identity-risk-workbench-alan-vo"
version = "1.0.1"
description = "Identity evidence analysis, review workflows and remediation simulation"
requires-python = ">=3.12"
authors = [{name = "Alan Vo", email = "alanvo@gmail.com"}]
license = {text = "MIT"}
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
